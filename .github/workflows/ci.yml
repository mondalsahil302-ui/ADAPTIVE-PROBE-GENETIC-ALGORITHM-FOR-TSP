name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Syntax & Compilation Verification
        run: |
          python -m py_compile $(find adaptive_evolution_research_console_v4/adaptive_evolution_research_editor_v4 -name "*.py")
          python -m py_compile run_console.py

      - name: Code Quality & Lint Check
        run: |
          # Check for syntax errors or undefined names
          flake8 adaptive_evolution_research_console_v4/adaptive_evolution_research_editor_v4 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Execute Automated Test Suite
        env:
          PYTHONPATH: ./adaptive_evolution_research_console_v4/adaptive_evolution_research_editor_v4
        run: |
          python -m unittest discover -s adaptive_evolution_research_console_v4/adaptive_evolution_research_editor_v4/tests -p "test_*.py" -v

  deploy:
    name: Deploy to Render
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "[!] RENDER_DEPLOY_HOOK_URL secret is not configured or empty. Skipping automatic deployment step safely."
            exit 0
          fi
          echo "[*] Triggering Render deployment via deploy hook..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_HOOK")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "[+] Render deployment triggered successfully (HTTP $HTTP_STATUS)."
          else
            echo "[!] Warning: Render deploy hook returned HTTP $HTTP_STATUS."
            exit 1
          fi

